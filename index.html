<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAGA Engine — Team Mitrujoy</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#080810; --bg2:#0f0f1a; --bg3:#141428;
      --border:rgba(100,100,255,0.15); --border2:rgba(100,100,255,0.3);
      --text:#e8e8ff; --text2:#8888aa; --text3:#44445a;
      --cyan:#00d4ff; --cyan-dim:rgba(0,212,255,0.12); --cyan-glow:rgba(0,212,255,0.3);
      --green:#00ff88; --green-dim:rgba(0,255,136,0.12);
      --red:#ff4466; --red-dim:rgba(255,68,102,0.12);
      --gold:#ffd700; --gold-dim:rgba(255,215,0,0.12);
      --purple:#aa44ff; --purple-dim:rgba(170,68,255,0.15);
      --orange:#ff8800;
    }
    body { background:var(--bg); color:var(--text); font-family:'Exo 2',sans-serif; min-height:100vh; overflow-x:hidden; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
      background-size:40px 40px; pointer-events:none; z-index:0;
    }
    #app { position:relative; z-index:1; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px 64px; }

    /* LOADING */
    .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; min-height:80vh; }
    .loading-logo { font-family:'Orbitron',monospace; font-size:36px; font-weight:900; letter-spacing:0.1em; color:var(--cyan); text-shadow:0 0 20px var(--cyan-glow); animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .loading-sub { font-size:13px; color:var(--text2); letter-spacing:0.2em; text-transform:uppercase; }
    .spinner { width:40px; height:40px; border:2px solid var(--border); border-top-color:var(--cyan); border-radius:50%; animation:spin 0.8s linear infinite; box-shadow:0 0 12px var(--cyan-glow); }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* SUBJECT SELECTOR */
    .subject-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
    .subject-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px 18px; display:flex; align-items:center; gap:14px; cursor:pointer; width:100%; text-align:left; font-family:"Exo 2",sans-serif; transition:border-color 0.2s,background 0.2s; }
    .subject-card:hover { border-color:var(--cyan); background:var(--bg3); }
    .subject-icon { font-size:28px; flex-shrink:0; width:44px; text-align:center; }
    .subject-info { flex:1; }
    .subject-name { font-family:"Orbitron",monospace; font-size:13px; font-weight:700; color:var(--text); letter-spacing:0.05em; margin-bottom:2px; }
    .subject-desc { font-size:12px; color:var(--text2); }
    .subject-arrow { color:var(--cyan); font-size:18px; font-family:"Orbitron",monospace; }
    .back-btn { background:transparent; border:1px solid var(--border2); border-radius:6px; color:var(--cyan); font-family:"Orbitron",monospace; font-size:10px; letter-spacing:0.1em; padding:4px 12px; cursor:pointer; transition:background 0.2s; }
    .back-btn:hover { background:var(--cyan-dim); }

    /* HOME */
    .home-wrap { width:100%; max-width:620px; }
    .home-header { text-align:center; padding:40px 20px 32px; margin-bottom:28px; border-bottom:1px solid var(--border); }
    .home-eyebrow { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:0.3em; color:var(--cyan); margin-bottom:12px; text-transform:uppercase; }
    .home-logo { font-family:'Orbitron',monospace; font-size:clamp(36px,8vw,56px); font-weight:900; letter-spacing:0.08em; color:var(--text); text-shadow:0 0 30px var(--cyan-glow); margin-bottom:4px; }
    .home-logo span { color:var(--cyan); }
    .home-tagline { font-size:13px; color:var(--text2); letter-spacing:0.05em; margin-bottom:20px; }
    .home-chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .home-chip { font-size:11px; padding:4px 12px; border-radius:99px; border:1px solid var(--border2); background:var(--bg3); color:var(--text2); letter-spacing:0.06em; }
    .modes-label { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:0.2em; color:var(--text3); text-transform:uppercase; margin-bottom:12px; }
    .modes-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
    .mode-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:16px; cursor:pointer; width:100%; text-align:left; font-family:'Exo 2',sans-serif; transition:border-color 0.2s,background 0.2s; position:relative; overflow:hidden; }
    .mode-card::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(0,212,255,0.04)); opacity:0; transition:opacity 0.2s; }
    .mode-card:hover { border-color:var(--cyan); }
    .mode-card:hover::before { opacity:1; }
    .mode-icon { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; background:var(--bg3); border:1px solid var(--border); }
    .mode-info { flex:1; }
    .mode-name { font-family:'Orbitron',monospace; font-size:13px; font-weight:700; color:var(--text); letter-spacing:0.05em; margin-bottom:3px; }
    .mode-desc { font-size:12px; color:var(--text2); }
    .mode-badge { font-family:'Orbitron',monospace; font-size:9px; padding:4px 10px; border-radius:99px; letter-spacing:0.1em; white-space:nowrap; }
    .badge-ready { background:var(--green-dim); color:var(--green); border:1px solid rgba(0,255,136,0.3); }
    .start-btn { width:100%; padding:16px; background:transparent; border:1px solid var(--cyan); border-radius:10px; font-family:'Orbitron',monospace; font-size:14px; font-weight:700; letter-spacing:0.15em; color:var(--cyan); cursor:pointer; text-transform:uppercase; transition:background 0.2s,box-shadow 0.2s; }
    .start-btn:hover { background:var(--cyan-dim); box-shadow:0 0 20px var(--cyan-glow); }
    .home-footer { text-align:center; margin-top:16px; font-size:11px; color:var(--text3); letter-spacing:0.08em; }

    /* GAME WRAP */
    .game-wrap { width:100%; max-width:620px; }
    .hud { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:14px 0; margin-bottom:16px; border-bottom:1px solid var(--border); gap:12px; }
    .hud-left { display:flex; flex-direction:column; gap:2px; }
    .hud-title { font-family:'Orbitron',monospace; font-size:12px; font-weight:700; color:var(--cyan); letter-spacing:0.08em; }
    .hud-meta { font-size:11px; color:var(--text2); }
    .hud-center { text-align:center; }
    .score-display { font-family:'Orbitron',monospace; font-size:28px; font-weight:900; color:var(--gold); text-shadow:0 0 15px rgba(255,215,0,0.4); transition:transform 0.15s; line-height:1; }
    .score-display.bump { animation:scoreBump 0.3s ease; }
    @keyframes scoreBump { 0%{transform:scale(1)} 50%{transform:scale(1.3);color:#fff} 100%{transform:scale(1)} }
    .score-label { font-size:9px; color:var(--text3); letter-spacing:0.15em; text-transform:uppercase; }
    .hud-right { display:flex; justify-content:flex-end; }
    .hearts { display:flex; gap:6px; align-items:center; }
    .heart { font-size:20px; transition:transform 0.2s,filter 0.2s; filter:drop-shadow(0 0 4px rgba(255,68,102,0.6)); }
    .heart.lost { filter:grayscale(1) brightness(0.3); transform:scale(0.85); }

    /* XP BAR */
    .xp-section { margin-bottom:16px; }
    .xp-row { display:flex; align-items:center; gap:10px; }
    .xp-label { font-family:'Orbitron',monospace; font-size:9px; color:var(--purple); letter-spacing:0.15em; min-width:20px; }
    .xp-track { flex:1; height:6px; background:var(--bg3); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
    .xp-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--purple),var(--cyan)); transition:width 0.5s ease; }
    .xp-count { font-size:11px; color:var(--text2); min-width:48px; text-align:right; font-variant-numeric:tabular-nums; }

    /* TIMER */
    .timer-section { margin-bottom:20px; }
    .timer-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
    .timer-track { flex:1; height:8px; background:var(--bg3); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
    .timer-fill { height:100%; border-radius:99px; transition:width 1s linear,background 0.4s; }
    .timer-num { font-family:'Orbitron',monospace; font-size:13px; font-weight:700; min-width:36px; text-align:right; font-variant-numeric:tabular-nums; transition:color 0.4s; }
    .timer-meta { display:flex; justify-content:space-between; font-size:10px; color:var(--text3); letter-spacing:0.08em; }
    .streak-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:99px; font-family:'Orbitron',monospace; font-size:11px; font-weight:700; letter-spacing:0.08em; border:1px solid var(--border); background:var(--bg3); color:var(--text3); transition:all 0.3s; }
    .streak-badge.active { background:rgba(255,136,0,0.15); border-color:rgba(255,136,0,0.4); color:var(--orange); box-shadow:0 0 12px rgba(255,136,0,0.2); animation:streakPulse 1s ease-in-out infinite; }
    @keyframes streakPulse { 0%,100%{box-shadow:0 0 12px rgba(255,136,0,0.2)} 50%{box-shadow:0 0 20px rgba(255,136,0,0.5)} }

    /* QUESTION CARD */
    .q-card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:24px 24px 18px; margin-bottom:12px; position:relative; overflow:hidden; }
    .q-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--purple),var(--cyan)); }
    .q-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .q-number { font-family:'Orbitron',monospace; font-size:10px; color:var(--cyan); letter-spacing:0.15em; text-transform:uppercase; }
    .q-diff { font-size:10px; padding:2px 8px; border-radius:99px; }
    .diff-easy   { background:var(--green-dim); color:var(--green); border:1px solid rgba(0,255,136,0.2); }
    .diff-medium { background:var(--gold-dim);  color:var(--gold);  border:1px solid rgba(255,215,0,0.2); }
    .diff-hard   { background:var(--red-dim);   color:var(--red);   border:1px solid rgba(255,68,102,0.2); }
    .q-text { font-size:18px; font-weight:600; line-height:1.5; color:var(--text); margin-bottom:14px; }
    .q-hint { font-size:12px; color:var(--text2); padding-top:12px; border-top:1px solid var(--border); display:flex; align-items:center; gap:6px; }
    .hint-icon { color:var(--cyan); font-size:14px; }

    /* OPTIONS */
    .options-grid { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
    .opt-btn { display:flex; align-items:center; gap:0; overflow:hidden; background:var(--bg2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:'Exo 2',sans-serif; cursor:pointer; text-align:left; width:100%; transition:border-color 0.15s,background 0.15s; }
    .opt-btn:hover:not(:disabled) { border-color:var(--cyan); background:var(--bg3); }
    .opt-btn:disabled { cursor:not-allowed; }
    .opt-key { width:52px; min-width:52px; height:52px; display:flex; align-items:center; justify-content:center; font-family:'Orbitron',monospace; font-size:12px; font-weight:700; background:var(--bg3); color:var(--text2); border-right:1px solid var(--border); flex-shrink:0; transition:all 0.2s; letter-spacing:0.05em; }
    .opt-text { padding:14px 18px; font-size:14px; line-height:1.4; flex:1; font-weight:500; }
    .opt-pts { padding:0 14px; font-family:'Orbitron',monospace; font-size:10px; color:var(--text3); white-space:nowrap; }
    .opt-btn.correct { border-color:var(--green); background:var(--green-dim); }
    .opt-btn.correct .opt-key { background:var(--green); color:var(--bg); border-right-color:var(--green); }
    .opt-btn.correct .opt-text { color:var(--green); }
    .opt-btn.wrong { border-color:var(--red); background:var(--red-dim); }
    .opt-btn.wrong .opt-key { background:var(--red); color:#fff; border-right-color:var(--red); }
    .opt-btn.wrong .opt-text { color:var(--red); }
    .opt-btn.dimmed { opacity:0.25; }

    /* FEEDBACK */
    .feedback-bar { font-size:13px; border-radius:10px; padding:12px 16px; border:1px solid var(--border); background:var(--bg2); color:var(--text2); min-height:44px; transition:all 0.2s; }
    .feedback-bar.correct { background:var(--green-dim); border-color:rgba(0,255,136,0.4); color:var(--green); }
    .feedback-bar.wrong { background:var(--red-dim); border-color:rgba(255,68,102,0.4); color:var(--red); }

    /* QUESTPATH */
    .qp-map { margin-bottom:16px; }
    .qp-nodes { display:flex; align-items:center; justify-content:center; gap:0; padding:16px 0; }
    .qp-node-dot { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid var(--border); background:var(--bg3); transition:all 0.3s; }
    .qp-node-dot.done { background:var(--green-dim); border-color:var(--green); }
    .qp-node-dot.active { background:var(--cyan-dim); border-color:var(--cyan); box-shadow:0 0 14px var(--cyan-glow); animation:nodePulse 1.5s ease-in-out infinite; }
    .qp-node-dot.locked { opacity:0.3; }
    @keyframes nodePulse { 0%,100%{box-shadow:0 0 14px var(--cyan-glow)} 50%{box-shadow:0 0 24px var(--cyan-glow)} }
    .qp-node-dot-icon { font-size:18px; }
    .qp-node-line { flex:1; height:2px; background:var(--border); min-width:12px; transition:background 0.3s; }
    .qp-node-line.done { background:var(--green); }
    .qp-node-card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:20px 22px 16px; margin-bottom:12px; position:relative; overflow:hidden; }
    .qp-node-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--cyan),var(--purple)); }
    .qp-node-header { display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; }
    .qp-node-icon { font-size:28px; flex-shrink:0; }
    .qp-node-title { font-family:'Orbitron',monospace; font-size:14px; font-weight:700; color:var(--cyan); margin-bottom:4px; letter-spacing:0.05em; }
    .qp-node-story { font-size:13px; color:var(--text2); line-height:1.5; }
    .qp-divider { height:1px; background:var(--border); margin-bottom:14px; }
    .qp-unlocks { font-size:10px; color:var(--purple); font-family:'Orbitron',monospace; letter-spacing:0.08em; }

    /* MIRRORMATCH */
    .mm-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding:10px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; }
    .mm-badge { font-family:'Orbitron',monospace; font-size:11px; color:var(--cyan); letter-spacing:0.08em; }
    .mm-timer { font-family:'Orbitron',monospace; font-size:13px; font-weight:700; color:var(--gold); letter-spacing:0.1em; }
    .mm-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
    .mm-card { height:80px; cursor:pointer; perspective:600px; }
    .mm-card-inner { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 0.4s ease; border-radius:10px; }
    .mm-card.flipped .mm-card-inner { transform:rotateY(180deg); }
    .mm-card.matched .mm-card-inner { transform:rotateY(180deg); }
    .mm-card.matched .mm-card-back { border-color:var(--green); background:var(--green-dim); }
    .mm-card-front, .mm-card-back { position:absolute; inset:0; border-radius:10px; backface-visibility:hidden; display:flex; align-items:center; justify-content:center; padding:8px; border:1px solid var(--border); }
    .mm-card-front { background:var(--bg3); }
    .mm-card-front:hover { border-color:var(--cyan); background:var(--bg2); }
    .mm-card-back { background:var(--bg2); transform:rotateY(180deg); border-color:var(--border2); }
    .mm-card-back.term { border-color:rgba(0,212,255,0.3); }
    .mm-card-back.definition { border-color:rgba(170,68,255,0.3); }
    .mm-card-icon { font-size:22px; color:var(--text3); }
    .mm-card-text { font-size:11px; color:var(--text); text-align:center; line-height:1.3; font-weight:500; }

    /* END SCREEN */
    .end-screen { text-align:center; padding:40px 16px; position:relative; }
    .end-eyebrow { font-family:'Orbitron',monospace; font-size:10px; color:var(--text3); letter-spacing:0.2em; margin-bottom:16px; text-transform:uppercase; }
    .end-heading { font-family:'Orbitron',monospace; font-size:clamp(28px,6vw,44px); font-weight:900; letter-spacing:0.08em; color:var(--gold); text-shadow:0 0 30px rgba(255,215,0,0.5); margin-bottom:8px; }
    .end-sub { font-size:14px; color:var(--text2); margin-bottom:32px; }
    .score-reveal { display:inline-flex; flex-direction:column; align-items:center; background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:28px 60px; margin-bottom:12px; gap:6px; position:relative; overflow:hidden; }
    .score-reveal::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--purple),var(--gold),var(--cyan)); }
    .score-reveal-label { font-family:'Orbitron',monospace; font-size:10px; color:var(--text3); letter-spacing:0.2em; text-transform:uppercase; }
    .score-reveal-value { font-family:'Orbitron',monospace; font-size:52px; font-weight:900; color:var(--gold); text-shadow:0 0 20px rgba(255,215,0,0.5); }
    .score-reveal-sub { font-size:12px; color:var(--text2); }
    .end-actions { display:flex; gap:10px; justify-content:center; margin-top:28px; }
    .btn-primary { padding:12px 28px; background:transparent; border:1px solid var(--cyan); border-radius:8px; font-family:'Orbitron',monospace; font-size:12px; font-weight:700; letter-spacing:0.12em; color:var(--cyan); cursor:pointer; text-transform:uppercase; transition:background 0.2s,box-shadow 0.2s; }
    .btn-primary:hover { background:var(--cyan-dim); box-shadow:0 0 16px var(--cyan-glow); }
    .btn-secondary { padding:12px 28px; background:transparent; border:1px solid var(--border2); border-radius:8px; font-family:'Orbitron',monospace; font-size:12px; letter-spacing:0.12em; color:var(--text2); cursor:pointer; text-transform:uppercase; transition:border-color 0.2s,color 0.2s; }
    .btn-secondary:hover { border-color:var(--text2); color:var(--text); }
    .end-footer { font-size:11px; color:var(--text3); margin-top:24px; letter-spacing:0.08em; }

    /* PARTICLES */
    .particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .particle { position:absolute; width:6px; height:6px; border-radius:50%; animation:fall linear forwards; }
    @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(600px) rotate(720deg);opacity:0} }

    .fade-in { animation:fadeIn 0.4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

    @media(max-width:520px) {
      .mm-grid { grid-template-columns:repeat(4,1fr); }
      .mm-card { height:64px; }
      .mm-card-text { font-size:9px; }
      .hud { grid-template-columns:1fr 1fr; }
      .hud-center { grid-column:1/-1; order:-1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="loading-logo">SAGA</div>
      <div class="spinner"></div>
      <div class="loading-sub">Initializing engine...</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
