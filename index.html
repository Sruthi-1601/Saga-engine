<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAGA Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Light classy palette ── */
      --bg:    #f5f2ee;
      --bg2:   #ffffff;
      --bg3:   #faf8f5;
      --bg4:   #f0ece6;

      /* Surfaces */
      --surface:  rgba(0,0,0,0.03);
      --surface2: rgba(0,0,0,0.055);

      /* Borders */
      --border:  rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.14);

      /* Text */
      --text1: #1a1612;
      --text2: #6b6255;
      --text3: #a39887;
      --text:  #1a1612;

      /* Primary — amber orange */
      --amber:      #e86c1a;
      --amber-dim:  rgba(232,108,26,0.10);
      --amber-glow: rgba(232,108,26,0.22);

      /* Accents */
      --jade:     #1a9e6e;
      --jade-dim: rgba(26,158,110,0.10);
      --rose:     #d4415a;
      --rose-dim: rgba(212,65,90,0.09);
      --sky:      #2e86c8;
      --sky-dim:  rgba(46,134,200,0.10);
      --lilac:    #7c5cbf;
      --lilac-dim:rgba(124,92,191,0.10);

      /* Legacy aliases — keep all game modules working */
      --cyan:       #2e86c8;
      --cyan-dim:   rgba(46,134,200,0.10);
      --cyan-glow:  rgba(46,134,200,0.20);
      --green:      #1a9e6e;
      --green-dim:  rgba(26,158,110,0.10);
      --red:        #d4415a;
      --red-dim:    rgba(212,65,90,0.09);
      --gold:       #e86c1a;
      --gold-dim:   rgba(232,108,26,0.10);
      --purple:     #7c5cbf;
      --purple-dim: rgba(124,92,191,0.10);
      --orange:     #e86c1a;

      --r-sm:  10px;
      --r-md:  16px;
      --r-lg:  22px;
      --r-xl:  28px;

      --sidebar-w: 280px;

      /* Fluid type scale */
      --fs-xs:  clamp(11px, 1.5vw, 12px);
      --fs-sm:  clamp(13px, 1.8vw, 14px);
      --fs-md:  clamp(15px, 2vw,   16px);
      --fs-lg:  clamp(18px, 2.5vw, 20px);
      --fs-xl:  clamp(22px, 3vw,   26px);
      --fs-2xl: clamp(28px, 4vw,   36px);
    }

    html { scroll-behavior: smooth; }

    body {
      background: #f5f2ee;
      color: var(--text1);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Doodle background canvas sits BEHIND app content ── */
    #doodle-bg {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      width: 100%; height: 100%;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 200;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    #app {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      padding: clamp(16px, 4vw, 40px) clamp(12px, 3vw, 24px) 80px;
    }

    /* ═══════════════════════════════════════════════════════
       LOADING
    ═══════════════════════════════════════════════════════ */
    .loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; min-height: 80vh;
      animation: fadeIn 0.4s ease both;
    }
    .loading-logo {
      font-size: clamp(40px,8vw,64px); font-weight: 800;
      letter-spacing: -0.04em; color: var(--text1);
      line-height: 1;
    }
    .loading { background: transparent; }
    .loading-logo span { color: var(--amber); }
    .loading-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; color: var(--text3); letter-spacing: 0.2em;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 1.5px solid var(--border2);
      border-top-color: var(--amber);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════════════════
       HOME — CENTERED HERO LAYOUT
    ═══════════════════════════════════════════════════════ */
    .home-layout {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      animation: heroEntrance 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes heroEntrance {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SIDEBAR → now a centered hero brand block ── */
    .home-sidebar {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 36px 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      width: 100%;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
    }
    /* Top gradient accent bar */
    .home-sidebar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--amber), var(--jade), var(--sky), var(--lilac));
      border-radius: var(--r-xl) var(--r-xl) 0 0;
    }
    /* Subtle inner glow */
    .home-sidebar::after {
      content: '';
      position: absolute;
      top: 3px; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to bottom, rgba(232,108,26,0.04), transparent);
      pointer-events: none;
    }

    .sidebar-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sidebar-logo {
      font-size: clamp(38px, 7vw, 52px);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text1);
      line-height: 1;
    }
    .sidebar-logo span { color: var(--amber); }
    .sidebar-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.18em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .sidebar-section { display: flex; flex-direction: column; gap: 6px; align-items: center; }

    .sidebar-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      width: 100%;
      text-align: center;
    }

    .sidebar-team {
      font-size: 15px;
      font-weight: 700;
      color: var(--text1);
      letter-spacing: -0.01em;
    }
    .sidebar-event {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text3);
    }

    .sidebar-stack {
      display: flex; flex-wrap: wrap; gap: 5px;
      justify-content: center;
    }
    .stack-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text2);
      letter-spacing: 0.04em;
      transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.18s;
      cursor: default;
    }
    .stack-tag:hover {
      background: var(--amber-dim);
      border-color: rgba(232,108,26,0.3);
      color: var(--amber);
      transform: translateY(-2px);
    }

    .sidebar-quote {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--text2);
      line-height: 1.6;
      padding: 10px 0 0;
      border-top: 1px solid var(--border);
    }
    .sidebar-quote em { color: var(--amber); font-style: normal; font-weight: 400; }

    /* Sidebar back button */
    .sidebar-back {
      align-self: flex-start;
    }

    /* Subject display in mode-select sidebar */
    .sidebar-subject-icon { font-size: 32px; margin: 4px 0; }

    .sidebar-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text2);
    }
    .sidebar-stat-row:last-child { border-bottom: none; }
    .sidebar-stat-row strong { color: var(--text1); font-weight: 600; }

    .sidebar-ai-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 8px 18px;
      border-radius: 6px;
      background: var(--jade-dim);
      border: 1px solid rgba(26,158,110,0.25);
      color: var(--jade);
      letter-spacing: 0.08em;
      text-align: center;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .sidebar-ai-badge:hover {
      background: rgba(26,158,110,0.15);
      box-shadow: 0 0 12px rgba(26,158,110,0.2);
    }

    /* ── MAIN PANEL ── */
    .home-main {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      animation: heroEntrance 0.6s cubic-bezier(0.22,1,0.36,1) 0.1s both;
    }

    /* ── SCANNER PANEL ── */
    .scanner-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 28px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.07);
      transition: box-shadow 0.25s, border-color 0.25s;
    }
    .scanner-panel:hover {
      box-shadow: 0 8px 40px rgba(0,0,0,0.11);
      border-color: var(--border2);
    }

    .scanner-title {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .scanner-icon-wrap {
      font-size: 32px;
      flex-shrink: 0;
      width: 60px; height: 60px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }
    .scanner-heading {
      font-size: clamp(20px, 2.5vw, 24px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text1);
      margin-bottom: 6px;
    }
    .scanner-sub { font-size: 15px; color: var(--text2); line-height: 1.5; }

    /* Document requirements */
    .doc-requirements {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-left: 3px solid var(--amber);
      border-radius: var(--r-md);
      padding: 14px 16px;
    }
    .doc-req-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--amber);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .doc-req-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .doc-req-list li {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.6;
      padding-left: 20px;
      position: relative;
    }
    .doc-req-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--amber);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }
    .doc-req-list li strong { color: var(--text1); font-weight: 600; }

    /* Upload zone */
    .upload-zone {
      border: 1px dashed rgba(39,196,138,0.3);
      border-radius: var(--r-lg);
      background: rgba(39,196,138,0.02);
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--jade);
      background: rgba(39,196,138,0.06);
    }
    .upload-zone-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .upload-formats { display: flex; gap: 8px; }
    .fmt-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text2);
    }
    .upload-cta { font-size: 15px; color: var(--text3); }
    .upload-btn {
      padding: 13px 28px;
      background: transparent;
      border: 1px solid var(--jade);
      border-radius: var(--r-sm);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--jade);
      cursor: pointer;
      transition: background 0.18s, box-shadow 0.18s;
    }
    .upload-btn:hover {
      background: var(--jade-dim);
      box-shadow: 0 0 14px rgba(39,196,138,0.2);
    }

    /* AI status */
    .ai-status-scanning, .ai-status-success, .ai-status-error {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: var(--r-md);
    }
    .ai-status-scanning { background: rgba(78,168,224,0.07); border: 1px solid rgba(78,168,224,0.18); }
    .ai-status-success  { background: var(--jade-dim); border: 1px solid rgba(39,196,138,0.22); }
    .ai-status-error    { background: var(--rose-dim); border: 1px solid rgba(232,82,111,0.22); }
    .ai-status-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; color: var(--text1); letter-spacing: 0.06em; margin-bottom: 3px;
    }
    .ai-status-sub { font-size: 13px; color: var(--text2); }
    .ai-spinner {
      width: 18px; height: 18px;
      border: 1.5px solid rgba(78,168,224,0.2);
      border-top-color: var(--sky);
      border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    .ai-status-bar-wrap {
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px; margin-top: 6px; overflow: hidden;
    }
    .ai-status-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--sky), var(--jade));
      border-radius: 99px; transition: width 0.4s ease;
    }

    .ai-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      padding: 5px 12px; border-radius: 6px;
      background: var(--jade-dim); border: 1px solid rgba(39,196,138,0.25);
      color: var(--jade); letter-spacing: 0.08em; margin-left: 8px;
    }

    /* Legacy .ai-section (used in appended styles) */
    .ai-section { margin-bottom: 16px; }
    .ai-section-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.2em; color: var(--text3); text-transform: uppercase;
      margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
    }
    .ai-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Old upload box fallback (used if JS not updated) */
    .ai-upload-box {
      border: 1px dashed rgba(39,196,138,0.3);
      border-radius: var(--r-lg);
      padding: 28px 20px; text-align: center; cursor: pointer;
      background: rgba(39,196,138,0.02); transition: all 0.2s;
    }
    .ai-upload-box:hover, .ai-upload-box.drag-over { border-color: var(--jade); background: rgba(39,196,138,0.06); }
    .ai-upload-icon { font-size: 28px; margin-bottom: 10px; }
    .ai-upload-title { font-size: 14px; font-weight: 700; color: var(--jade); margin-bottom: 4px; }
    .ai-upload-sub   { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
    .ai-upload-types { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); letter-spacing: 0.1em; margin-bottom: 14px; }
    .ai-upload-btn {
      padding: 8px 20px; background: transparent; border: 1px solid var(--jade);
      border-radius: var(--r-sm); font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.1em; color: var(--jade); cursor: pointer; transition: background 0.18s;
    }
    .ai-upload-btn:hover { background: var(--jade-dim); }

    /* ── MODE SELECT section head ── */
    .modes-section-head {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; letter-spacing: 0.16em; color: var(--text3);
      text-transform: uppercase;
      display: flex; align-items: center; gap: 10px;
      padding: 0 0 2px;
    }
    .modes-section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── MODES GRID ── */
    .modes-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.14em; color: var(--text3);
      text-transform: uppercase;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px; margin-top: 4px;
    }
    .modes-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .modes-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }

    /* ── Mode cards — interactive with shimmer + float ── */
    .mode-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: clamp(14px,2.5vw,20px) clamp(16px,3vw,24px);
      display: flex; align-items: center; gap: clamp(12px,2vw,18px);
      cursor: pointer; width: 100%; text-align: left;
      transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative; overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      min-height: 72px;
    }
    /* Shimmer sweep on hover */
    .mode-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      transition: left 0.45s ease;
      pointer-events: none;
    }
    .mode-card:hover::after { left: 160%; }

    /* Accent bar */
    .mode-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; border-radius: 0 2px 2px 0;
      background: var(--amber); opacity: 0;
      transition: opacity 0.2s;
    }
    .mode-card:hover {
      background: var(--bg4);
      transform: translateX(3px) translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .mode-card:hover::before { opacity: 1; }
    .mode-card:active { transform: translateX(1px) translateY(0px); }

    /* Quiz cards — amber accent */
    .mode-pair-card:hover {
      border-color: rgba(240,122,36,0.4);
      box-shadow: 0 4px 20px rgba(240,122,36,0.08);
    }

    /* Game cards — rose accent */
    .mode-game-card::before { background: var(--rose); }
    .mode-game-card:hover {
      border-color: rgba(232,82,111,0.35);
      box-shadow: 0 4px 20px rgba(232,82,111,0.08);
    }

    /* Mode icon — bounces on hover */
    .mode-icon {
      width: clamp(44px,6vw,54px); height: clamp(44px,6vw,54px); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(20px,3vw,26px); flex-shrink: 0;
      background: var(--bg4); border: 1px solid var(--border);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), border-color 0.2s;
    }
    .mode-card:hover .mode-icon {
      transform: scale(1.15) rotate(-4deg);
      border-color: var(--border2);
    }

    /* Staggered entrance animation */
    .modes-grid .mode-card { animation: cardSlideIn 0.35s ease both; }
    .modes-grid .mode-card:nth-child(1) { animation-delay: 0.04s; }
    .modes-grid .mode-card:nth-child(2) { animation-delay: 0.09s; }
    .modes-grid .mode-card:nth-child(3) { animation-delay: 0.14s; }
    .modes-grid .mode-card:nth-child(4) { animation-delay: 0.19s; }
    .modes-grid .mode-card:nth-child(5) { animation-delay: 0.24s; }
    .modes-grid .mode-card:nth-child(6) { animation-delay: 0.29s; }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .mode-info { flex: 1; }
    .mode-name { font-size: clamp(15px,2vw,17px); font-weight: 700; color: var(--text1); letter-spacing: -0.01em; margin-bottom: 3px; transition: color 0.2s; }
    .mode-card:hover .mode-name { color: var(--amber); }
    .mode-game-card:hover .mode-name { color: var(--rose); }
    .mode-desc { font-size: clamp(12px,1.6vw,14px); color: var(--text2); line-height: 1.5; }

    .mode-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 5px 10px; border-radius: 6px; letter-spacing: 0.08em; white-space: nowrap;
    }
    .badge-ready { background: var(--jade-dim); color: var(--jade); border: 1px solid rgba(39,196,138,0.25); }
    .badge-quiz  { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,122,36,0.25); }
    .badge-game  { background: var(--rose-dim); color: var(--rose); border: 1px solid rgba(232,82,111,0.25); }

    .behaviour-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--lilac); border: 1px solid rgba(160,126,245,0.25);
      border-radius: 5px; padding: 3px 8px; margin-left: 8px; vertical-align: middle;
    }

    /* Divider */
    .divider-row { display: flex; align-items: center; gap: 12px; margin: 2px 0 18px; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--text3); letter-spacing: 0.12em; white-space: nowrap;
    }

    /* Home footer */
    .home-footer {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--text3); letter-spacing: 0.08em;
      text-align: center; padding-top: 12px;
      border-top: 1px solid var(--border); margin-top: 8px;
    }

    /* ── BUTTONS ── */
    .back-btn {
      background: transparent; border: 1px solid var(--border2);
      border-radius: var(--r-sm); color: var(--text2);
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      letter-spacing: 0.06em; padding: 8px 16px; cursor: pointer;
      transition: background 0.16s, color 0.16s;
    }
    .back-btn:hover { background: var(--surface2); color: var(--text1); }

    .btn-primary {
      padding: 14px 28px; background: transparent;
      border: 1px solid var(--amber); border-radius: var(--r-sm);
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      font-weight: 700; letter-spacing: 0.1em; color: var(--amber);
      cursor: pointer; text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover { background: var(--amber-dim); box-shadow: 0 0 18px var(--amber-glow); }

    .btn-secondary {
      padding: 14px 28px; background: transparent;
      border: 1px solid var(--border2); border-radius: var(--r-sm);
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      letter-spacing: 0.1em; color: var(--text2);
      cursor: pointer; text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn-secondary:hover { border-color: var(--text2); color: var(--text1); background: var(--surface); }

    /* ═══════════════════════════════════════════════════════
       QUIZ MODE
    ═══════════════════════════════════════════════════════ */
    .quiz-progress-bar { width: 100%; height: 3px; background: var(--surface); border-radius: 99px; margin: 0 0 10px; overflow: hidden; }
    .quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--amber), var(--jade)); border-radius: 99px; transition: width 0.4s ease; }
    .quiz-counter { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text3); letter-spacing: 0.1em; margin-bottom: 16px; }
    .quiz-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 24px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
    .quiz-question { font-size: clamp(16px,2.2vw,20px); font-weight: 600; color: var(--text1); margin-bottom: 22px; line-height: 1.6; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .quiz-option {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: clamp(13px,2vw,17px) clamp(14px,2.5vw,20px);
      cursor: pointer; text-align: left; transition: all 0.15s; color: var(--text1);
      font-size: clamp(14px,2vw,16px); min-height: 56px;
    }
    .quiz-option:hover:not(:disabled) { border-color: var(--amber); background: var(--amber-dim); }
    .quiz-option:disabled { cursor: default; }
    .quiz-option.quiz-correct { border-color: var(--jade)!important; background: var(--jade-dim)!important; color: var(--jade); }
    .quiz-option.quiz-wrong   { border-color: var(--rose)!important; background: var(--rose-dim)!important; color: var(--rose); }
    .quiz-opt-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--amber); min-width: 22px; }
    .quiz-opt-text { flex: 1; }
    .quiz-hint { font-size: 13px; color: var(--text3); margin-bottom: 12px; line-height: 1.6; padding: 10px 14px; background: var(--surface); border-radius: var(--r-sm); border-left: 3px solid var(--amber); }
    .quiz-feedback { min-height: 28px; font-size: 15px; margin-bottom: 14px; font-weight: 600; }
    .quiz-fb-correct { color: var(--jade); }
    .quiz-fb-wrong   { color: var(--rose); }
    .quiz-next { width: 100%; }
    .quiz-summary-list { display: flex; flex-direction: column; gap: 7px; margin-top: 20px; width: 100%; max-width: 540px; }
    .quiz-summary-item {
      display: grid; grid-template-columns: 36px 1fr auto; align-items: start; gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 13px 16px; font-size: 14px; text-align: left;
    }
    .quiz-summary-item.qs-correct { border-color: rgba(39,196,138,0.22); }
    .quiz-summary-item.qs-wrong   { border-color: rgba(232,82,111,0.22); }
    .qs-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); padding-top: 2px; }
    .qs-q    { color: var(--text2); line-height: 1.5; font-size: 14px; }
    .qs-result { color: var(--text2); font-size: 13px; word-break: break-word; }

    /* ═══════════════════════════════════════════════════════
       GAME HUD SHARED
    ═══════════════════════════════════════════════════════ */
    .gm-wrap { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 10px; }
    .gm-hud {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--r-md); padding: 10px 16px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .gm-hud-left .gm-title { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--amber); letter-spacing: 0.06em; }
    .gm-hud-left .gm-meta  { font-size: 12px; color: var(--text3); margin-top: 3px; }
    .gm-hud-center { text-align: center; }
    .score-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); letter-spacing: 0.12em; }
    .score-display { font-family: 'JetBrains Mono', monospace; font-size: clamp(22px,3vw,28px); font-weight: 700; color: var(--amber); }
    .score-display.bump { transform: scale(1.25); transition: transform 0.15s; }
    .gm-hud-right .hearts { display: flex; gap: 5px; font-size: 20px; }
    .heart { color: var(--rose); transition: opacity 0.3s; }
    .heart.lost { opacity: 0.18; }
    .gm-question-bar { background: var(--amber-dim); border: 1px solid rgba(240,122,36,0.2); border-radius: var(--r-sm); padding: clamp(12px,2vw,18px) clamp(14px,2.5vw,22px); font-size: clamp(15px,2vw,18px); color: var(--text1); font-weight: 600; line-height: 1.5; text-align: center; }
    .gm-feedback { min-height: 36px; text-align: center; font-size: clamp(14px,2vw,16px); font-weight: 600; border-radius: var(--r-sm); padding: 8px 16px; transition: all 0.2s; }
    .gm-feedback.correct { color: var(--jade); background: var(--jade-dim); }
    .gm-feedback.wrong   { color: var(--rose); background: var(--rose-dim); }
    .gm-progress { width: 100%; height: 3px; background: var(--surface); border-radius: 99px; overflow: hidden; }
    .gm-progress-fill { height: 100%; background: linear-gradient(90deg, var(--amber), var(--jade)); border-radius: 99px; transition: width 0.4s ease; }

    /* ═══════════════════════════════════════════════════════
       DUNGEON / MAZE / ENEMY (game canvases)
    ═══════════════════════════════════════════════════════ */
    .dungeon-arena { width: 100%; height: 200px; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: #0a0608; }
    .dungeon-arena canvas { width: 100%; height: 100%; display: block; }
    .dungeon-question-panel { background: rgba(120,60,20,0.09); border: 1px solid rgba(180,100,30,0.22); border-radius: var(--r-md); padding: 14px 16px; }
    .dungeon-q-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--amber); letter-spacing: 0.12em; margin-bottom: 6px; }
    .dungeon-question { font-size: 1rem; color: var(--text1); font-weight: 600; margin-bottom: 12px; line-height: 1.55; }
    .dungeon-options { display: flex; flex-direction: column; gap: 8px; }
    .dungeon-opt { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 14px; cursor: pointer; text-align: left; color: var(--text1); font-size: 0.88rem; transition: all 0.15s; }
    .dungeon-opt:hover:not(:disabled) { border-color: var(--amber); background: var(--amber-dim); }
    .dungeon-opt:disabled { cursor: default; opacity: 0.7; }
    .dungeon-opt.dopt-correct { border-color: var(--jade)!important; background: var(--jade-dim)!important; color: var(--jade); }
    .dungeon-opt.dopt-wrong   { border-color: var(--rose)!important; background: var(--rose-dim)!important; color: var(--rose); }
    .dungeon-opt-key { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: var(--amber); min-width: 18px; }
    .dungeon-hint { font-size: 0.78rem; color: var(--text3); margin-top: 8px; line-height: 1.5; }

    .maze-arena { width: 100%; overflow: auto; border: 1px solid rgba(78,168,224,0.2); border-radius: var(--r-md); background: #0d0d1a; display: flex; justify-content: center; padding: 8px; }
    .maze-arena canvas { display: block; image-rendering: pixelated; }
    .maze-question-panel { background: rgba(0,60,120,0.10); border: 1px solid rgba(78,168,224,0.2); border-radius: var(--r-md); padding: 14px 16px; }
    .maze-q-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--sky); letter-spacing: 0.12em; margin-bottom: 6px; }
    .maze-question { font-size: 1rem; color: var(--text1); font-weight: 600; margin-bottom: 12px; line-height: 1.55; }
    .maze-options { display: flex; flex-direction: column; gap: 8px; }
    .maze-hint { font-size: 0.78rem; color: var(--text3); margin-top: 8px; }
    .maze-controls { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
    .maze-btn { width: 40px; height: 40px; background: var(--surface); border: 1px solid rgba(78,168,224,0.28); border-radius: var(--r-sm); color: var(--sky); font-size: 15px; cursor: pointer; transition: all 0.15s; }
    .maze-btn:hover { background: var(--sky-dim); color: var(--text1); }

    .enemy-arena { width: 100%; height: 200px; border: 1px solid rgba(232,82,111,0.18); border-radius: var(--r-md); overflow: hidden; background: #05050f; }
    .enemy-arena canvas { width: 100%; height: 100%; display: block; }
    .enemy-question-panel { background: rgba(80,0,0,0.09); border: 1px solid rgba(232,82,111,0.18); border-radius: var(--r-md); padding: 14px 16px; }
    .enemy-q-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--rose); letter-spacing: 0.12em; margin-bottom: 6px; }
    .enemy-question { font-size: 1rem; color: var(--text1); font-weight: 600; margin-bottom: 12px; line-height: 1.55; }
    .enemy-options { display: flex; flex-direction: column; gap: 8px; }
    .enemy-opt { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 14px; cursor: pointer; text-align: left; color: var(--text1); font-size: 0.88rem; transition: all 0.15s; }
    .enemy-opt:hover:not(:disabled) { border-color: var(--rose); background: var(--rose-dim); }
    .enemy-opt:disabled { cursor: default; opacity: 0.7; }
    .enemy-hint { font-size: 0.78rem; color: var(--text3); margin-top: 8px; }

    /* ═══════════════════════════════════════════════════════
       NEURONRUSH / LEGACY GAME WRAP
    ═══════════════════════════════════════════════════════ */
    .game-wrap { width: 100%; max-width: 680px; }
    .hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); gap: 12px; }
    .hud-left { display: flex; flex-direction: column; gap: 2px; }
    .hud-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--amber); letter-spacing: 0.08em; }
    .hud-meta { font-size: 11px; color: var(--text2); }
    .hud-center { text-align: center; }
    .hud-right { display: flex; justify-content: flex-end; }

    .xp-section { margin-bottom: 16px; }
    .xp-row { display: flex; align-items: center; gap: 10px; }
    .xp-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--lilac); letter-spacing: 0.15em; min-width: 20px; }
    .xp-track { flex: 1; height: 5px; background: var(--bg4); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
    .xp-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--lilac), var(--sky)); transition: width 0.5s ease; }
    .xp-count { font-size: 11px; color: var(--text2); min-width: 48px; text-align: right; }

    .timer-section { margin-bottom: 20px; }
    .timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .timer-track { flex: 1; height: 6px; background: var(--bg4); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
    .timer-fill { height: 100%; border-radius: 99px; transition: width 1s linear, background 0.4s; }
    .timer-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; transition: color 0.4s; }
    .timer-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); letter-spacing: 0.08em; }
    .streak-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; border: 1px solid var(--border); background: var(--bg3); color: var(--text3); transition: all 0.3s; }
    .streak-badge.active { background: var(--amber-dim); border-color: rgba(240,122,36,0.4); color: var(--amber); box-shadow: 0 0 12px var(--amber-glow); animation: streakPulse 1.2s ease-in-out infinite; }
    @keyframes streakPulse { 0%,100%{box-shadow:0 0 10px var(--amber-glow)} 50%{box-shadow:0 0 22px rgba(240,122,36,0.45)} }
    @keyframes scoreBump { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

    .q-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 24px 24px 18px; margin-bottom: 12px; position: relative; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
    .q-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--amber), var(--jade)); }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .q-number { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--amber); letter-spacing: 0.12em; text-transform: uppercase; }
    .q-diff { font-size: 12px; padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
    .diff-easy   { background: var(--jade-dim); color: var(--jade); border: 1px solid rgba(39,196,138,0.22); }
    .diff-medium { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,122,36,0.22); }
    .diff-hard   { background: var(--rose-dim); color: var(--rose); border: 1px solid rgba(232,82,111,0.22); }
    .q-text { font-size: clamp(17px,2.5vw,22px); font-weight: 600; line-height: 1.55; color: var(--text1); margin-bottom: 16px; }
    .q-hint { font-size: 14px; color: var(--text2); padding-top: 14px; border-top: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; line-height: 1.6; }
    .hint-icon { color: var(--amber); font-size: 13px; }

    .options-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .opt-btn { display: flex; align-items: center; gap: 0; overflow: hidden; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text1); font-family: 'Syne', sans-serif; cursor: pointer; text-align: left; width: 100%; transition: border-color 0.14s, background 0.14s; }
    .opt-btn:hover:not(:disabled) { border-color: var(--amber); background: var(--bg3); }
    .opt-btn:disabled { cursor: not-allowed; }
    .opt-key { width: clamp(50px,7vw,60px); min-width: clamp(50px,7vw,60px); height: clamp(52px,7vw,64px); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; background: var(--bg3); color: var(--text3); border-right: 1px solid var(--border); flex-shrink: 0; transition: all 0.18s; }
    .opt-text { padding: clamp(14px,2vw,18px) clamp(16px,2.5vw,22px); font-size: clamp(14px,2vw,16px); line-height: 1.5; flex: 1; font-weight: 500; }
    .opt-pts { padding: 0 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); white-space: nowrap; }
    .opt-btn.correct { border-color: var(--jade); background: var(--jade-dim); }
    .opt-btn.correct .opt-key { background: var(--jade); color: var(--bg); border-right-color: var(--jade); }
    .opt-btn.correct .opt-text { color: var(--jade); }
    .opt-btn.wrong { border-color: var(--rose); background: var(--rose-dim); }
    .opt-btn.wrong .opt-key { background: var(--rose); color: #fff; border-right-color: var(--rose); }
    .opt-btn.wrong .opt-text { color: var(--rose); }
    .opt-btn.dimmed { opacity: 0.22; }

    .feedback-bar { font-size: 15px; border-radius: var(--r-sm); padding: 12px 16px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); min-height: 44px; transition: all 0.2s; }
    .feedback-bar.correct { background: var(--jade-dim); border-color: rgba(39,196,138,0.35); color: var(--jade); }
    .feedback-bar.wrong   { background: var(--rose-dim); border-color: rgba(232,82,111,0.35); color: var(--rose); }

    /* QuestPath */
    .qp-map { margin-bottom: 16px; }
    .qp-nodes { display: flex; align-items: center; justify-content: center; gap: 0; padding: 16px 0; }
    .qp-node-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1.5px solid var(--border); background: var(--bg3); transition: all 0.3s; }
    .qp-node-dot.done { background: var(--jade-dim); border-color: var(--jade); }
    .qp-node-dot.active { background: var(--amber-dim); border-color: var(--amber); box-shadow: 0 0 14px var(--amber-glow); animation: nodePulse 1.5s ease-in-out infinite; }
    .qp-node-dot.locked { opacity: 0.22; }
    @keyframes nodePulse { 0%,100%{box-shadow:0 0 10px var(--amber-glow)} 50%{box-shadow:0 0 22px var(--amber-glow)} }
    .qp-node-dot-icon { font-size: 16px; }
    .qp-node-line { flex: 1; height: 1.5px; background: var(--border); min-width: 12px; transition: background 0.3s; }
    .qp-node-line.done { background: var(--jade); }
    .qp-node-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 20px 22px 16px; margin-bottom: 12px; position: relative; overflow: hidden; }
    .qp-node-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--sky), var(--lilac)); }
    .qp-node-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
    .qp-node-icon { font-size: 26px; flex-shrink: 0; }
    .qp-node-title { font-size: 14px; font-weight: 700; color: var(--sky); margin-bottom: 4px; letter-spacing: -0.01em; }
    .qp-node-story { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .qp-divider { height: 1px; background: var(--border); margin-bottom: 14px; }
    .qp-unlocks { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--lilac); letter-spacing: 0.08em; }

    /* MirrorMatch */
    .mm-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-sm); }
    .mm-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--sky); letter-spacing: 0.06em; }
    .mm-timer { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--amber); letter-spacing: 0.1em; }
    .mm-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 12px; }
    .mm-card { height: 80px; cursor: pointer; perspective: 600px; }
    .mm-card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease; border-radius: var(--r-sm); }
    .mm-card.flipped .mm-card-inner { transform: rotateY(180deg); }
    .mm-card.matched .mm-card-inner { transform: rotateY(180deg); }
    .mm-card.matched .mm-card-back  { border-color: var(--jade); background: var(--jade-dim); }
    .mm-card-front, .mm-card-back { position: absolute; inset: 0; border-radius: var(--r-sm); backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 8px; border: 1px solid var(--border); }
    .mm-card-front { background: var(--bg3); }
    .mm-card-front:hover { border-color: var(--amber); background: var(--bg2); }
    .mm-card-back { background: var(--bg2); transform: rotateY(180deg); border-color: var(--border2); }
    .mm-card-back.term { border-color: rgba(78,168,224,0.3); }
    .mm-card-back.definition { border-color: rgba(160,126,245,0.3); }
    .mm-card-icon { font-size: 20px; color: var(--text3); }
    .mm-card-text { font-size: 11px; color: var(--text1); text-align: center; line-height: 1.3; font-weight: 500; }

    /* MirrorMaze */
    .mirror-term-card { background: var(--lilac-dim); border: 1px solid rgba(160,126,245,0.22); border-radius: var(--r-md); padding: 16px; text-align: center; }
    .mirror-term-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); letter-spacing: 0.1em; margin-bottom: 6px; }
    .mirror-term-text { font-size: 1.4rem; font-weight: 700; color: var(--lilac); margin-bottom: 4px; }
    .mirror-hint { font-size: 11px; color: var(--text3); }
    .mirror-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .mirror-panel { perspective: 600px; cursor: pointer; height: 90px; position: relative; }
    .mirror-panel-front, .mirror-panel-back { position: absolute; inset: 0; border-radius: var(--r-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; backface-visibility: hidden; transition: transform 0.5s; }
    .mirror-panel-front { background: var(--lilac-dim); border: 1px solid rgba(160,126,245,0.22); transform: rotateY(0deg); }
    .mirror-panel-back { background: var(--surface); border: 1px solid var(--border2); transform: rotateY(180deg); font-size: 11px; color: var(--text2); padding: 8px; text-align: center; }
    .mirror-panel.flipped .mirror-panel-front { transform: rotateY(-180deg); }
    .mirror-panel.flipped .mirror-panel-back  { transform: rotateY(0deg); }
    .mirror-icon { font-size: 22px; }
    .mirror-panel-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--lilac); }
    .mirror-panel.correct-panel .mirror-panel-back { border-color: var(--jade); background: var(--jade-dim); }
    .mirror-panel.shattered-panel .mirror-panel-back { border-color: var(--rose); background: var(--rose-dim); }
    .mirror-scoring { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text3); flex-wrap: wrap; gap: 6px; }
    .mirror-score-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .msb { padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; }
    .msb.first  { background: rgba(240,122,36,0.15); color: var(--amber); border: 1px solid rgba(240,122,36,0.3); }
    .msb.second { background: rgba(192,192,192,0.1); color: #c0c0c0; border: 1px solid rgba(192,192,192,0.2); }
    .msb.third  { background: rgba(205,127,50,0.12); color: #cd7f32; border: 1px solid rgba(205,127,50,0.2); }
    .msb.other  { background: var(--surface); color: var(--text3); border: 1px solid var(--border); }

    /* ═══════════════════════════════════════════════════════
       END SCREEN
    ═══════════════════════════════════════════════════════ */
    .end-screen { text-align: center; padding: 48px 16px; position: relative; }
    .end-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text3); letter-spacing: 0.15em; margin-bottom: 16px; text-transform: uppercase; }
    .end-heading { font-size: clamp(30px,6vw,46px); font-weight: 800; letter-spacing: -0.04em; color: var(--amber); margin-bottom: 8px; }
    .end-sub { font-size: 17px; color: var(--text2); margin-bottom: 32px; }
    .score-reveal { display: inline-flex; flex-direction: column; align-items: center; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 28px 60px; margin-bottom: 12px; gap: 6px; position: relative; overflow: hidden; box-shadow: 0 4px 30px rgba(0,0,0,0.08); }
    .score-reveal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--amber), var(--jade), var(--sky)); }
    .score-reveal-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; }
    .score-reveal-value { font-size: 52px; font-weight: 800; color: var(--amber); letter-spacing: -0.04em; }
    .score-reveal-sub { font-size: 16px; color: var(--text2); }
    .end-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .end-footer { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text3); margin-top: 28px; letter-spacing: 0.08em; }

    /* PARTICLES */
    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; animation: fall linear forwards; }
    @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(600px) rotate(720deg);opacity:0} }

    /* ANIMATIONS */
    .fade-in { animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

    /* ═══════════════════════════════════════════════════════
       SUBJECT CARDS (kept for legacy / AI-gen subject)
    ═══════════════════════════════════════════════════════ */
    .subject-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .subject-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; width: 100%; text-align: left; transition: border-color 0.16s, background 0.16s, transform 0.14s; box-shadow: 0 1px 6px rgba(0,0,0,0.05); min-height: 68px; }
    .subject-card:hover { border-color: var(--amber); background: var(--bg4); transform: translateX(2px); }
    .subject-icon { font-size: 28px; flex-shrink: 0; width: 40px; text-align: center; }
    .subject-info { flex: 1; }
    .subject-name { font-size: 16px; font-weight: 700; color: var(--text1); margin-bottom: 2px; letter-spacing: -0.01em; }
    .subject-desc { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text3); }
    .subject-arrow { color: var(--amber); font-size: 15px; }

    /* Chips used in old home-header */
    .home-wrap { width: 100%; max-width: 680px; }
    .home-header { padding: 40px 0 28px; margin-bottom: 28px; border-bottom: 1px solid var(--border); position: relative; }
    .home-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.28em; color: var(--amber); text-transform: uppercase; margin-bottom: 14px; }
    .home-logo { font-size: clamp(36px,8vw,56px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-bottom: 8px; color: var(--text1); }
    .home-logo span { color: var(--amber); }
    .home-tagline { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: var(--text2); margin-bottom: 18px; line-height: 1.5; }
    .home-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .home-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border2); background: var(--surface); color: var(--text3); letter-spacing: 0.06em; }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE — mobile-first breakpoints
    ═══════════════════════════════════════════════════════ */

    /* ── Tablet (≤900px) ── */
    @media (max-width: 900px) {
      .home-layout { max-width: 100%; }
      .scanner-heading { font-size: 20px; }
    }

    /* ── Large mobile / small tablet (≤700px) ── */
    @media (max-width: 700px) {
      .home-layout {
        gap: 14px;
      }
      .home-sidebar {
        padding: 28px 22px 24px;
      }
      .sidebar-logo { font-size: 36px; }

      .scanner-panel { padding: 20px 18px; }
      .scanner-title { gap: 12px; }
      .scanner-icon-wrap { width: 48px; height: 48px; font-size: 24px; }
      .scanner-heading { font-size: 18px; }
      .scanner-sub { font-size: 13px; }

      .doc-requirements { padding: 12px 14px; }
      .doc-req-list li { font-size: 13px; }

      .upload-zone { padding: 24px 16px; }
      .upload-formats { flex-wrap: wrap; justify-content: center; }

      .mode-card { min-height: 64px; padding: 14px 16px; gap: 12px; }
      .mode-icon { width: 42px; height: 42px; font-size: 20px; }
      .mode-name { font-size: 15px; }
      .mode-desc { font-size: 12px; }
      .mode-badge { font-size: 10px; padding: 4px 8px; }

      /* Game HUD stacks on mobile */
      .gm-hud { flex-wrap: wrap; gap: 8px; }
      .gm-hud-center { order: -1; width: 100%; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

      /* MirrorMatch */
      .mm-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .mm-card { height: 70px; }
      .mm-card-text { font-size: 10px; }

      /* HUD legacy */
      .hud { grid-template-columns: 1fr 1fr; }
      .hud-center { grid-column: 1/-1; order: -1; }

      /* End screen */
      .end-actions { flex-direction: column; align-items: stretch; }
      .btn-primary, .btn-secondary { width: 100%; text-align: center; }
      .score-reveal { padding: 24px 32px; }
      .score-reveal-value { font-size: 44px; }

      /* Quiz summary — collapse columns */
      .quiz-summary-item { grid-template-columns: 28px 1fr; }
      .qs-result { grid-column: 2; font-size: 12px; }
    }

    /* ── Small mobile (≤400px) ── */
    @media (max-width: 400px) {
      #app { padding: 12px 10px 60px; }

      .home-sidebar { padding: 22px 18px 18px; }
      .sidebar-logo { font-size: 30px; }

      .scanner-panel { padding: 16px 14px; }
      .doc-req-list li { font-size: 12px; }

      .mode-card { padding: 12px 14px; min-height: 58px; }
      .mode-icon { width: 38px; height: 38px; font-size: 18px; }
      .mode-name { font-size: 14px; }
      .mode-desc { display: none; }
      .mode-badge { display: none; }

      .mm-grid { grid-template-columns: repeat(2, 1fr); }

      .score-reveal { padding: 20px 20px; }
      .score-reveal-value { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="loading-logo">SAGA <span>ENGINE</span></div>
      <div class="spinner"></div>
      <div class="loading-sub">Initializing engine...</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>

  <script>
  (function() {
    // ── Create canvas and insert as first child of body ──────────────────────
    const canvas = document.createElement('canvas');
    canvas.id = 'doodle-bg';
    document.body.insertBefore(canvas, document.body.firstChild);
    const ctx = canvas.getContext('2d');

    // ── Colour palette for light bg ──────────────────────────────────────────
    const COLORS = [
      { stroke: '#e86c1a', fill: 'rgba(232,108,26,0.12)' },  // amber
      { stroke: '#1a9e6e', fill: 'rgba(26,158,110,0.10)' },  // jade
      { stroke: '#7c5cbf', fill: 'rgba(124,92,191,0.10)' },  // lilac
      { stroke: '#2e86c8', fill: 'rgba(46,134,200,0.10)' },  // sky
      { stroke: '#d4415a', fill: 'rgba(212,65,90,0.09)'  },  // rose
    ];

    const SHAPES = ['circle','cross','dot','square','triangle','zigzag','star','wave','arc','diamond'];

    let doodles = [];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      seedDoodles();
    }

    function seedDoodles() {
      doodles = [];
      const density = Math.floor((canvas.width * canvas.height) / 9000);
      for (let i = 0; i < density; i++) {
        const col = COLORS[Math.floor(Math.random() * COLORS.length)];
        doodles.push({
          x:        Math.random() * canvas.width,
          y:        Math.random() * canvas.height,
          size:     12 + Math.random() * 26,
          type:     SHAPES[Math.floor(Math.random() * SHAPES.length)],
          alpha:    0.10 + Math.random() * 0.18,   // MUCH more visible
          speed:    0.20 + Math.random() * 0.40,
          phase:    Math.random() * Math.PI * 2,
          stroke:   col.stroke,
          fill:     col.fill,
          rotSpeed: (Math.random() - 0.5) * 0.006,
          rot:      Math.random() * Math.PI * 2,
          lw:       1.0 + Math.random() * 1.2,
        });
      }
    }

    resize();
    window.addEventListener('resize', resize);

    /* ── Draw functions ──────────────────────────────────────────────────── */
    function dCircle(c, d)   { c.beginPath(); c.arc(0,0,d.size*0.45,0,Math.PI*2); c.stroke(); }
    function dCross(c, d)    { const s=d.size*0.42; c.beginPath(); c.moveTo(-s,0); c.lineTo(s,0); c.moveTo(0,-s); c.lineTo(0,s); c.stroke(); }
    function dDot(c, d)      { c.beginPath(); c.arc(0,0,d.size*0.2,0,Math.PI*2); c.fill(); }
    function dSquare(c, d)   { const s=d.size*0.4; c.strokeRect(-s,-s,s*2,s*2); }
    function dDiamond(c, d)  { const s=d.size*0.48; c.beginPath(); c.moveTo(0,-s); c.lineTo(s*0.6,0); c.lineTo(0,s); c.lineTo(-s*0.6,0); c.closePath(); c.stroke(); }
    function dTriangle(c, d) { const s=d.size*0.5; c.beginPath(); c.moveTo(0,-s); c.lineTo(s*0.87,s*0.5); c.lineTo(-s*0.87,s*0.5); c.closePath(); c.stroke(); }
    function dZigzag(c, d)   { const s=d.size*0.5; c.beginPath(); c.moveTo(-s,s*0.3); c.lineTo(-s*0.33,-s*0.3); c.lineTo(s*0.33,s*0.3); c.lineTo(s,-s*0.3); c.stroke(); }
    function dWave(c, d)     { const s=d.size*0.5; c.beginPath(); c.moveTo(-s,0); for(let i=0;i<=8;i++){const x=-s+(i/8)*s*2; c.lineTo(x,Math.sin(i*Math.PI/2)*(d.size*0.22));} c.stroke(); }
    function dArc(c, d)      { c.beginPath(); c.arc(0,d.size*0.18,d.size*0.38,-Math.PI,0); c.stroke(); }
    function dStar(c, d)     {
      const s=d.size*0.45,inner=s*0.42; c.beginPath();
      for(let i=0;i<5;i++){
        const oa=(i*Math.PI*2/5)-Math.PI/2, ia=oa+Math.PI/5;
        if(i===0) c.moveTo(Math.cos(oa)*s,Math.sin(oa)*s);
        else c.lineTo(Math.cos(oa)*s,Math.sin(oa)*s);
        c.lineTo(Math.cos(ia)*inner,Math.sin(ia)*inner);
      }
      c.closePath(); c.stroke();
    }

    const FNS = {circle:dCircle,cross:dCross,dot:dDot,square:dSquare,triangle:dTriangle,
                 zigzag:dZigzag,star:dStar,wave:dWave,arc:dArc,diamond:dDiamond};

    let frame = 0;
    function draw() {
      // Fill background colour so canvas IS the background
      ctx.fillStyle = '#f5f2ee';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      frame++;
      doodles.forEach(d => {
        d.rot += d.rotSpeed;
        const fy = d.y + Math.sin(frame * 0.010 * d.speed + d.phase) * 7;
        const fx = d.x + Math.cos(frame * 0.007 * d.speed + d.phase) * 4;

        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(d.rot);
        ctx.globalAlpha  = d.alpha;
        ctx.strokeStyle  = d.stroke;
        ctx.fillStyle    = d.fill;
        ctx.lineWidth    = d.lw;
        ctx.lineCap      = 'round';
        ctx.lineJoin     = 'round';

        const fn = FNS[d.type];
        if (fn) fn(ctx, d);
        ctx.restore();
      });

      requestAnimationFrame(draw);
    }
    draw();
  })();
  </script>
</body>
</html>
